name: Atualizar site

on:
  schedule:
    # segunda, terça e sábado às 9:07 UTC (06:07 em Brasília); o minuto 7 evita o horário de pico do GitHub
    - cron: "7 9 * * 1,2,6"
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    branches: [main]        # publica também quando você altera o projeto

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicação por vez; não cancela a que já está em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        if: github.event_name != 'schedule'   # a atualização semanal não depende dos testes
        run: pytest -q

      - name: Gerar o site
        env:
          NFL_TZ: America/Sao_Paulo
          NFL_SEASON: ${{ vars.NFL_SEASON }}   # opcional: Settings > Variables > Actions
        run: python generate.py --out site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5